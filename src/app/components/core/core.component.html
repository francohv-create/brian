<div class="brian-center">
  <!-- <div class="brian-face">
    <img src="logo2.svg" alt="" />
    <div class="online-dot"></div>
  </div> -->
  <div class="brian-face">
    <img src="logo2.svg" alt="" />
    <div class="online-dot"></div>
  </div>

  <div class="brian-label">Brian · online</div> <!-- Translated 'en línea' to 'online' -->
  <div class="brian-title">For whom do we generate the proposal?</div> 
  <!-- <div class="brian-sub">
    I have 12 previous proposals ready to learn from them.
  </div> -->
</div>
<form
  class="hero"
  [formGroup]="form"
  (ngSubmit)="sendPrompt()"
  [class.loading]="loading"
>
  <div class="tags">
    <div class="tag" [class.on]="mode === 'new'" (click)="setMode('new')"> <!-- Changed 'nuevo' to 'new' -->
      New Client 
    </div>

    <div class="tag" [class.on]="mode === 'current'" (click)="setMode('current')"> <!-- Changed 'actual' to 'current' -->
      Current Client 
    </div>
    <div *ngIf="mode === 'current'" class="client-input"> <!-- Changed 'actual' to 'current' -->
      <input
        type="text"
        formControlName="clientName"
        placeholder="Client Name" 
      />
      <div class="error" *ngIf="form.get('clientName')?.invalid">
        The message is required 
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <textarea
      formControlName="message"
      (focus)="onFocusTextarea()"
      [class.expanded]="isExpanded"
      placeholder="Ask Brian something..." 
    ></textarea>
    <div class="input-actions">
      <button class="send-btn" type="submit">
        Generate 
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="M3 8h10M9 4l4 4-4 4"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>
  <div
    class="error" 
    *ngIf="form.get('message')?.invalid && form.get('message')?.touched"
  >
    The message is required 
  </div>

  <div class="tags">
    <div
      class="tag"
      *ngFor="let tag of tags"
      [class.on]="tag.active"
      (click)="toggleTag(tag)"
    >
      <span class="tag-dot" [style.background]="tag.color"></span>
      {{ tag.label }}
    </div>
  </div>
</form>

<brian-footer></brian-footer>
